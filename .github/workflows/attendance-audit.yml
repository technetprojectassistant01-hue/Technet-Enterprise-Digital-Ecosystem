name: Attendance audit pings

# workflow_dispatch only - the schedule trigger was removed 2026-09-25. Measured against this
# actual GitHub account/repo: a */5 cron here fired once in >4 hours, ~1 hour after its own
# configured window had already closed, then not again for a full day - not "best-effort lag",
# effectively non-functional for a 5-minute-response-window feature. checkin-reminder.yml's own
# history shows the identical pattern (its fixed twice-daily cron lands roughly once a day at
# unrepeatable times), so this is a platform/account-level limitation, not something wrong with
# this specific workflow file. GitHub's own guidance is that high-frequency scheduled workflows
# get deprioritized under load, which matches what was observed.
#
# The reliable trigger is now an external cron service (cron-job.org or equivalent) calling
# POST /api/push/run-attendance-audits directly on the same schedule this file used to run
# (every 5 minutes, 07:00-18:59 Mauritius / 03:00-14:59 UTC, Mon-Sat) with the
# x-reminder-secret header set to the same REMINDER_TRIGGER_SECRET value configured in Render.
# This file is kept for manual workflow_dispatch testing only.
#
# The endpoint itself is gated behind ATTENDANCE_AUDIT_ENABLED on the server and is a no-op until
# that's set - see server/src/routes/push.ts.
on:
  workflow_dispatch: # manual testing only - see above for the real trigger

jobs:
  run-audits:
    runs-on: ubuntu-latest
    steps:
      - name: Run due attendance audit pings
        env:
          API_URL: ${{ vars.API_URL || 'https://technet-digital-api.onrender.com' }}
          REMINDER_SECRET: ${{ secrets.REMINDER_TRIGGER_SECRET }}
        run: |
          if [ -z "$REMINDER_SECRET" ]; then
            echo "REMINDER_TRIGGER_SECRET is not set in repository secrets — nothing sent."
            exit 1
          fi

          response=$(curl -sS -m 180 -w '\n%{http_code}' -X POST \
            -H "x-reminder-secret: $REMINDER_SECRET" \
            -H 'Content-Type: application/json' \
            "$API_URL/api/push/run-attendance-audits")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "Attendance audit trigger failed."
            exit 1
          fi
