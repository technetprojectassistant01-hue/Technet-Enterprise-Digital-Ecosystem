name: Deploy client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

# One deploy at a time, newest wins. Commits are pushed one file at a time, so a dozen runs can start
# within seconds; without this they raced and whichever finished last went live - twice an older
# commit's app replaced the newest (2026-10-08 and 10-09), so new pages "didn't appear" though the
# latest run was green. A newer push now cancels any deploy still running for an older one.
concurrency:
  group: deploy-client
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Empty on purpose: the Worker (client/worker/index.ts) proxies /api to the Render API
          # under this same origin, so the client calls it with a relative path. A first-party
          # cookie is what keeps an installed iOS PWA logged in.
          VITE_API_URL: ""
