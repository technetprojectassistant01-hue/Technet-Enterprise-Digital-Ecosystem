name: Attendance reminders

# Mauritius is UTC+4 with no daylight saving time. 04:15 UTC is 08:15 Mauritius and
# 13:15 UTC is 17:15 Mauritius, Monday to Saturday.
#
# workflow_dispatch only - the schedule triggers were removed 2026-09-25. Measured against this
# actual GitHub account/repo over a week: these fixed twice-daily crons landed roughly once a day,
# at unrepeatable times unrelated to 04:15/13:15 UTC (see git history for the measurements) - not
# "best-effort lag" as the comment here used to say, effectively non-functional as a reminder
# system with any real precision. attendance-audit.yml hit the identical pattern the same day.
# This is a platform/account-level GitHub Actions scheduling limitation, not a bug in this file.
#
# The reliable trigger is now an external cron service (cron-job.org or equivalent) calling
# POST /api/push/send-checkin-reminders at 08:15 Mauritius and
# POST /api/push/send-checkout-reminders at 17:15 Mauritius, both Mon-Sat, with the
# x-reminder-secret header set to the same REMINDER_TRIGGER_SECRET value configured in Render.
# This file is kept for manual workflow_dispatch testing only.
#
# This still lives here (rather than a timer inside the server) partly by inertia from when GitHub
# Actions was the trigger - the Render free instance sleeping after ~15 minutes idle is the actual
# reason a setInterval-based approach never worked, and that reasoning still holds regardless of
# which external caller wakes it.
on:
  workflow_dispatch: # manual testing only - see above for the real trigger

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Send 08:15 Mauritius check-in reminders
        env:
          API_URL: ${{ vars.API_URL || 'https://technet-digital-api.onrender.com' }}
          REMINDER_SECRET: ${{ secrets.REMINDER_TRIGGER_SECRET }}
        run: |
          if [ -z "$REMINDER_SECRET" ]; then
            echo "REMINDER_TRIGGER_SECRET is not set in repository secrets — nothing sent."
            exit 1
          fi

          response=$(curl -sS -m 180 -w '\n%{http_code}' -X POST \
            -H "x-reminder-secret: $REMINDER_SECRET" \
            -H 'Content-Type: application/json' \
            "$API_URL/api/push/send-checkin-reminders")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "Check-in reminder trigger failed."
            exit 1
          fi

  check-out:
    runs-on: ubuntu-latest
    steps:
      - name: Send 17:15 Mauritius check-out reminders
        env:
          API_URL: ${{ vars.API_URL || 'https://technet-digital-api.onrender.com' }}
          REMINDER_SECRET: ${{ secrets.REMINDER_TRIGGER_SECRET }}
        run: |
          if [ -z "$REMINDER_SECRET" ]; then
            echo "REMINDER_TRIGGER_SECRET is not set in repository secrets — nothing sent."
            exit 1
          fi

          response=$(curl -sS -m 180 -w '\n%{http_code}' -X POST \
            -H "x-reminder-secret: $REMINDER_SECRET" \
            -H 'Content-Type: application/json' \
            "$API_URL/api/push/send-checkout-reminders")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "Check-out reminder trigger failed."
            exit 1
          fi
