services:
  - type: web
    name: technet-digital-api
    runtime: node
    plan: free
    # Runs from the repo root (not a rootDir) on purpose: this is an npm-workspaces monorepo,
    # and the root package.json + lockfile are what npm needs to resolve server/'s dependencies
    # correctly. Mirrors the exact commands railway.json used successfully.
    # --include=dev is required here: NODE_ENV=production (below) applies during the build step
    # too, which makes a plain `npm ci` skip devDependencies - but the build itself needs
    # typescript/@types/*/vitest to compile. This forces them in regardless of NODE_ENV.
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://technet-digital.technetprojectassistant01.workers.dev
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Web Push for the 08:15 check-in reminder. Declared here rather than only in the dashboard
      # because this service is Blueprint-managed: a var that exists in the dashboard but not in
      # this file can be dropped on the next sync. sync: false means "value is set by hand in the
      # dashboard, never read from this repo" - same as the secrets above.
      #
      # Without the VAPID trio the server logs one warning at boot and every send is a silent
      # no-op. REMINDER_TRIGGER_SECRET must match the GitHub repository secret of the same name
      # exactly, or /api/push/send-checkin-reminders answers 404 and the scheduled workflow in
      # .github/workflows/checkin-reminder.yml fails every morning.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: REMINDER_TRIGGER_SECRET
        sync: false
